# Pas l'temps — API sur Cloudflare Workers (déployée par .github/workflows/deploy-api.yml)
name = "pasltemps"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
REPORT_THRESHOLD = "3"

[[d1_databases]]
binding = "DB"
database_name = "pasltemps"
database_id = "A_REMPLIR_AUTOMATIQUEMENT"
