# Pas l'temps — API sur Cloudflare Workers (déployée par .github/workflows/deploy-api.yml)
name = "pasltemps"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
REPORT_THRESHOLD = "3"
# Connexion par e-mail : expéditeur (adresse validée dans Brevo) et adresses où l'appli est servie
MAIL_FROM = "Pas l'temps <pasltempssav@gmail.com>"
APP_ORIGINS = "https://zcabande-arch.github.io"

# Notifications : chaque minute, on envoie celles arrivées à l'heure (chrono « Je pars », rappel tous les 3 jours)
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pasltemps"
database_id = "8fec2d16-9f82-43a5-9809-7d58553239d8"
