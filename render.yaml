# Déploiement en un clic sur Render (https://render.com) : New → Blueprint → choisir ce dépôt.
# Le disque garde la base de données entre deux mises à jour (offre payante « Starter » requise pour les disques).
services:
  - type: web
    name: pas-ltemps
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /data
      # Code de la page de modération (/admin.html) : Render le génère, à retrouver dans Environment
      - key: ADMIN_TOKEN
        generateValue: true
    disk:
      name: donnees
      mountPath: /data
      sizeGB: 1
