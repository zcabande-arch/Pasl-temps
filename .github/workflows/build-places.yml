name: Construire les lieux (OpenStreetMap)

# Chaque semaine : télécharge les données OpenStreetMap de l'Europe (et de l'Outre-mer français), garde les lieux utiles à l'appli
# (boulangeries, cafés, parcs, musées…) et les découpe en petites tuiles d'environ 5 km.
# Les tuiles sont publiées sur la branche « places » ; l'appli les lit directement, sans passer par
# le service Overpass (lent et souvent surchargé).
on:
  schedule:
    - cron: "17 3 * * 1"   # le lundi vers 5 h (heure de Paris)
  workflow_dispatch:
  push:
    branches: [main, claude/pas-ltemps-web-app-i23p2m]
    paths: [scripts/build-places.js, .github/workflows/build-places.yml]

permissions:
  contents: write

concurrency:
  group: build-places
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Télécharger OpenStreetMap (toute l'Europe, pays par pays) et garder les lieux utiles
        run: |
          set -o pipefail
          # région Geofabrik : code pays (pour les codes postaux). La France est obligatoire, les autres sont ignorés s'ils échouent.
          REGIONS="france:fr france/guadeloupe:fr france/martinique:fr france/guyane:fr france/reunion:fr france/mayotte:fr
            albania:al andorra:ad austria:at azores:pt belgium:be bosnia-herzegovina:ba bulgaria:bg croatia:hr cyprus:cy
            czech-republic:cz denmark:dk estonia:ee faroe-islands:fo finland:fi germany:de great-britain:gb greece:gr
            guernsey-jersey:gg hungary:hu iceland:is ireland-and-northern-ireland:ie isle-of-man:im italy:it kosovo:xk
            latvia:lv liechtenstein:li lithuania:lt luxembourg:lu macedonia:mk malta:mt moldova:md monaco:mc montenegro:me
            netherlands:nl norway:no poland:pl portugal:pt romania:ro serbia:rs slovakia:sk slovenia:si spain:es sweden:se
            switzerland:ch ukraine:ua"
          mkdir -p extraits
          ARGS=""
          for rc in $REGIONS; do
            r="${rc%%:*}"; cc="${rc##*:}"; f="${r//\//-}"
            if ! curl -fsSL --retry 3 --retry-delay 20 -o "$f.osm.pbf" "https://download.geofabrik.de/europe/$r-latest.osm.pbf"; then
              if [ "$r" = "france" ]; then echo "::error::France non téléchargée"; exit 1; fi
              echo "::warning::$r non téléchargé, ignoré cette semaine"; rm -f "$f.osm.pbf"; continue
            fi
            osmium tags-filter "$f.osm.pbf" \
              nwr/shop=bakery,pastry,ice_cream,mall,department_store,farm,gift,souvenir,books,supermarket,convenience,greengrocer,organic,butcher,cheese,seafood,deli,wine,alcohol,frozen_food \
              nwr/amenity=cafe,fast_food,food_court,ice_cream,restaurant,marketplace,place_of_worship,library,bar,pub,biergarten \
              nwr/leisure=park,garden,nature_reserve,common,track,fitness_centre,sports_centre \
              nwr/tourism=picnic_site,viewpoint,attraction,museum,gallery \
              nwr/historic=monument,castle \
              -o "$f.lieux.pbf" \
            && osmium export "$f.lieux.pbf" -f geojsonseq -a type,id --geometry-types=point,linestring,polygon -o - | gzip -1 > "extraits/$f.geojsonseq.gz" \
            || { rm -f "$f.osm.pbf" "$f.lieux.pbf" "extraits/$f.geojsonseq.gz"; [ "$r" = "france" ] && exit 1; echo "::warning::$r illisible, ignoré"; continue; }
            rm -f "$f.osm.pbf" "$f.lieux.pbf"
            ARGS="$ARGS $cc:extraits/$f.geojsonseq.gz"
            echo "$r ($cc) : $(du -h "extraits/$f.geojsonseq.gz" | cut -f1)"
          done
          echo "$ARGS" > extraits/args.txt
          du -sh extraits

      - name: Découper en tuiles
        # (la zone couverte n'est pas un rectangle : l'appli regarde s'il y a une tuile là où l'on est)
        run: |
          set -o pipefail
          node --max-old-space-size=12000 scripts/build-places.js sortie/ $(cat extraits/args.txt) | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publier sur la branche « places »
        run: |
          cd sortie
          git init -q -b places
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Lieux OpenStreetMap du $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" places
          echo "Tuiles publiées sur la branche places" >> "$GITHUB_STEP_SUMMARY"
