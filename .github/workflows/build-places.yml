name: Construire les lieux (OpenStreetMap)

# Chaque semaine : télécharge OpenStreetMap pour le monde entier (continent par continent, en parallèle),
# garde les lieux utiles à l'appli (boulangeries, cafés, parcs, musées…) et les découpe en tuiles d'environ 5 km,
# puis réassemble le tout et le publie sur la branche « places ». L'appli les lit directement, sans passer
# par le service Overpass (lent et souvent surchargé).
on:
  schedule:
    - cron: "17 3 * * 1"   # le lundi vers 5 h (heure de Paris)
  workflow_dispatch:
  push:
    branches: [main, claude/pas-ltemps-web-app-i23p2m]
    paths: [scripts/build-places.js, scripts/merge-places.js, scripts/extract-places.sh, .github/workflows/build-places.yml]

permissions:
  contents: write

concurrency:
  group: build-places
  cancel-in-progress: true

jobs:
  partie:
    name: Lieux – ${{ matrix.nom }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          # « région:pays » ; pays vide = continent entier (le pays vient de l'adresse de chaque lieu)
          - nom: europe
            obligatoire: europe/france
            regions: "europe/france:fr europe/france/guadeloupe:fr europe/france/martinique:fr europe/france/guyane:fr europe/france/reunion:fr europe/france/mayotte:fr europe/albania:al europe/andorra:ad europe/austria:at europe/azores:pt europe/belgium:be europe/bosnia-herzegovina:ba europe/bulgaria:bg europe/croatia:hr europe/cyprus:cy europe/czech-republic:cz europe/denmark:dk europe/estonia:ee europe/faroe-islands:fo europe/finland:fi europe/germany:de europe/great-britain:gb europe/greece:gr europe/guernsey-jersey:gg europe/hungary:hu europe/iceland:is europe/ireland-and-northern-ireland:ie europe/isle-of-man:im europe/italy:it europe/kosovo:xk europe/latvia:lv europe/liechtenstein:li europe/lithuania:lt europe/luxembourg:lu europe/macedonia:mk europe/malta:mt europe/moldova:md europe/monaco:mc europe/montenegro:me europe/netherlands:nl europe/norway:no europe/poland:pl europe/portugal:pt europe/romania:ro europe/serbia:rs europe/slovakia:sk europe/slovenia:si europe/spain:es europe/sweden:se europe/switzerland:ch europe/ukraine:ua europe/turkey:tr europe/belarus:by "
          - nom: russie
            regions: "russia:ru"
          - nom: amerique-du-nord
            regions: "north-america/us:us north-america/canada:ca north-america/mexico:mx north-america/greenland:gl"
          - nom: amerique-centrale-et-du-sud
            regions: "central-america: south-america:"
          - nom: asie
            regions: "asia:"
          - nom: afrique
            regions: "africa:"
          - nom: oceanie
            regions: "australia-oceania:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Faire de la place sur le disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h .
      - name: Installer osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Télécharger et garder les lieux utiles
        run: scripts/extract-places.sh extraits "${{ matrix.regions }}" "${{ matrix.obligatoire }}"
      - name: Découper en tuiles
        run: |
          set -o pipefail
          node --max-old-space-size=12000 scripts/build-places.js partie/ $(cat extraits/args.txt) | tee -a "$GITHUB_STEP_SUMMARY"
          tar -czf partie-${{ matrix.nom }}.tgz -C partie .
          ls -lh partie-${{ matrix.nom }}.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: partie-${{ matrix.nom }}
          path: partie-${{ matrix.nom }}.tgz
          retention-days: 2

  publier:
    name: Réassembler et publier
    needs: partie
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: partie-*
          path: parties
          merge-multiple: true
      - name: Réassembler
        run: |
          set -o pipefail
          for f in parties/*.tgz; do d="parties/$(basename "$f" .tgz)"; mkdir -p "$d"; tar -xzf "$f" -C "$d"; rm "$f"; done
          # sans l'Europe (France comprise), on ne publie rien : l'ancienne version reste en ligne
          test -f parties/partie-europe/index.json || { echo "::error::partie Europe manquante"; exit 1; }
          node --max-old-space-size=12000 scripts/merge-places.js sortie/ parties/partie-* | tee -a "$GITHUB_STEP_SUMMARY"
          test -f sortie/t/977_47.json
      - name: Publier sur la branche « places »
        run: |
          cd sortie
          git init -q -b places
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Lieux OpenStreetMap du $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" places
          echo "Tuiles publiées sur la branche places" >> "$GITHUB_STEP_SUMMARY"
