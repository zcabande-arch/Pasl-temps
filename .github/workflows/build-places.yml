name: Construire les lieux (OpenStreetMap)

# Chaque semaine : télécharge OpenStreetMap pour le monde entier (continent par continent, en parallèle),
# garde les lieux utiles à l'appli (boulangeries, cafés, parcs, musées…) et les découpe en tuiles d'environ 5 km,
# puis réassemble le tout et le publie sur la branche « places ». L'appli les lit directement, sans passer
# par le service Overpass (lent et souvent surchargé).
on:
  schedule:
    - cron: "17 3 * * 1"   # le lundi vers 5 h (heure de Paris)
  workflow_dispatch:
  push:
    branches: [main, claude/pas-ltemps-web-app-i23p2m]
    paths: [scripts/build-places.js, scripts/merge-places.js, scripts/extract-places.sh, .github/workflows/build-places.yml]

permissions:
  contents: write

concurrency:
  group: build-places
  cancel-in-progress: false      # une nouvelle demande attend la fin de la précédente, sans l'annuler

jobs:
  partie:
    name: Lieux – ${{ matrix.nom }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          # « région:pays » ; pays vide = continent entier (le pays vient de l'adresse de chaque lieu)
          # L'Europe en plusieurs morceaux : une seule machine ne finit pas à temps quand le serveur est lent
          - nom: france
            obligatoire: europe/france
            regions: "europe/france:fr europe/france/guadeloupe:fr europe/france/martinique:fr europe/france/guyane:fr europe/france/reunion:fr europe/france/mayotte:fr"
          - nom: europe-ouest
            regions: "europe/belgium:be europe/denmark:dk europe/faroe-islands:fo europe/germany:de europe/great-britain:gb europe/guernsey-jersey:gg europe/iceland:is europe/ireland-and-northern-ireland:ie europe/isle-of-man:im europe/luxembourg:lu europe/netherlands:nl"
          - nom: europe-sud
            regions: "europe/albania:al europe/andorra:ad europe/azores:pt europe/cyprus:cy europe/greece:gr europe/italy:it europe/malta:mt europe/monaco:mc europe/portugal:pt europe/spain:es europe/turkey:tr"
          - nom: europe-centre
            regions: "europe/austria:at europe/bosnia-herzegovina:ba europe/croatia:hr europe/czech-republic:cz europe/hungary:hu europe/kosovo:xk europe/liechtenstein:li europe/macedonia:mk europe/montenegro:me europe/serbia:rs europe/slovakia:sk europe/slovenia:si europe/switzerland:ch"
          - nom: europe-est-et-nord
            regions: "europe/bulgaria:bg europe/estonia:ee europe/finland:fi europe/latvia:lv europe/lithuania:lt europe/moldova:md europe/norway:no europe/poland:pl europe/romania:ro europe/sweden:se europe/ukraine:ua europe/belarus:by"
          - nom: russie
            regions: "russia:ru"
          - nom: amerique-du-nord
            regions: "north-america/us:us north-america/canada:ca north-america/mexico:mx north-america/greenland:gl"
          - nom: amerique-centrale-et-du-sud
            regions: "central-america: south-america:"
          - nom: asie
            regions: "asia:"
          - nom: afrique
            regions: "africa:"
          - nom: oceanie
            regions: "australia-oceania:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Faire de la place sur le disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h .
      - name: Installer osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Télécharger et garder les lieux utiles
        run: scripts/extract-places.sh extraits "${{ matrix.regions }}" "${{ matrix.obligatoire }}"
      - name: Découper en tuiles
        run: |
          set -o pipefail
          node --max-old-space-size=12000 scripts/build-places.js partie/ $(cat extraits/args.txt) | tee -a "$GITHUB_STEP_SUMMARY"
          cp extraits/manquants.txt partie/
          tar -czf partie-${{ matrix.nom }}.tgz -C partie .
          ls -lh partie-${{ matrix.nom }}.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: partie-${{ matrix.nom }}
          path: partie-${{ matrix.nom }}.tgz
          retention-days: 2

  publier:
    name: Réassembler et publier
    needs: partie
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: partie-*
          path: parties
          merge-multiple: true
      - name: Réassembler
        env:
          PARTIES: 11                 # nombre de parties de la liste ci-dessus
        run: |
          set -o pipefail
          for f in parties/*.tgz; do d="parties/$(basename "$f" .tgz)"; mkdir -p "$d"; tar -xzf "$f" -C "$d"; rm "$f"; done
          # sans la France, on ne publie rien : l'ancienne version reste en ligne
          test -f parties/partie-france/index.json || { echo "::error::partie France manquante"; exit 1; }
          # partie ou région manquante : on garde ses anciennes tuiles
          ANCIEN=""; REPO="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "$(ls -d parties/partie-*/ | wc -l)" -lt "$PARTIES" ] || [ -n "$(cat parties/partie-*/manquants.txt)" ] ; then
            echo "::warning::zones manquantes : $(cat parties/partie-*/manquants.txt | tr '\n' ' ') – anciennes tuiles reprises"
            git clone -q --depth 1 -b places "$REPO" ancien
            ANCIEN="--ancien=ancien"
          fi
          node --max-old-space-size=12000 scripts/merge-places.js sortie/ parties/partie-* $ANCIEN | tee -a "$GITHUB_STEP_SUMMARY"
          # garde-fou : jamais une publication nettement plus petite que la précédente
          AVANT=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/places/index.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).count')
          node -e 'const n=require("./sortie/index.json").count,a=+process.argv[1];if(!(a>0)||n<a*0.9){console.log(`::error::${n} lieux contre ${a} avant : rien publié`);process.exit(1)}' "$AVANT"
          test -f sortie/t/977_47.json
      - name: Publier sur la branche « places »
        run: |
          cd sortie
          git init -q -b places
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Lieux OpenStreetMap du $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" places
          echo "Tuiles publiées sur la branche places" >> "$GITHUB_STEP_SUMMARY"
